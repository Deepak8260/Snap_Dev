services:
  app:
    image: kumar3472/snapdev:latest
    container_name: snapdev-app
    restart: unless-stopped

    ports:
      - "5000:5000"

    pull_policy: always

    networks:
      - snapnet

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    ports:
      - "8081:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro

    networks:
      - snapnet
    depends_on:
      - redis
  redis:
    image: redis:latest
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - snapnet


networks:
  snapnet:
