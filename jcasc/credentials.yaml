credentials:
  system:
    domainCredentials:
      - credentials:

          # -----------------------------
          # GitHub Credentials
          # -----------------------------
          - usernamePassword:
              id: "github-creds"
              scope: GLOBAL
              username: "${GITHUB_USERNAME}"
              password: "${GITHUB_TOKEN}"
              description: "GitHub Credentials"

          # -----------------------------
          # Docker Hub Credentials
          # -----------------------------
          - usernamePassword:
              id: "dockerhub-creds"
              scope: GLOBAL
              username: "${DOCKERHUB_USERNAME}"
              password: "${DOCKERHUB_PASSWORD}"
              description: "Docker Hub Credentials"
